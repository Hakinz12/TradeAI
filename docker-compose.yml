services:
  alpha-fun:
    build: .
    env_file: .env
    environment:
      # Bind inside the container; ports below expose it on host loopback only.
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"   # reachable from this machine only
    volumes:
      - alpha-fun-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
volumes:
  alpha-fun-data:
